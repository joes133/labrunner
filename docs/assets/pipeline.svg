<svg viewBox="0 0 720 632" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>labrunner 十一个阶段全景</title>
<desc>从收资料到复盘的十一个阶段纵向流程图，其中阶段 2.5 经验匹配用虚线空心圆表示始终没接上，阶段 6 执行用绿色标为主干。</desc>
<text x="40" y="32" font-size="15" font-weight="500" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">十一个阶段 · 从收资料到复盘</text>
<text x="40" y="54" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">2.5 那一环始终没接上，它是整个设计的赌注</text>
<line x1="76" y1="78" x2="76" y2="620" stroke="#E3E0D8" stroke-width="1"/>

<circle cx="76" cy="100" r="4.5" fill="#378ADD"/>
<text x="92" y="104" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">0</text>
<text x="136" y="104" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">收资料</text>
<text x="250" y="104" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">登记你给的每一份材料</text>

<circle cx="76" cy="150" r="4.5" fill="#378ADD"/>
<text x="92" y="154" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">0.5</text>
<text x="136" y="154" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">申请存储</text>
<text x="250" y="154" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">先说清产物放哪、占多大</text>

<circle cx="76" cy="200" r="4.5" fill="#378ADD"/>
<text x="92" y="204" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">1</text>
<text x="136" y="204" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">体检</text>
<text x="250" y="204" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">查缺失、查矛盾，出待确认清单</text>

<circle cx="76" cy="250" r="4.5" fill="#378ADD"/>
<text x="92" y="254" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">2</text>
<text x="136" y="254" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">对齐</text>
<text x="250" y="254" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">等你补齐资料、裁决冲突</text>

<circle cx="76" cy="300" r="4.5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>
<text x="92" y="304" font-size="12" font-weight="500" fill="#8A8578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">2.5</text>
<text x="136" y="304" font-size="13" font-weight="500" fill="#8A8578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">经验匹配</text>
<text x="250" y="304" font-size="12" fill="#A8A49A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">设计中，每次执行都跳过</text>

<circle cx="76" cy="350" r="4.5" fill="#378ADD"/>
<text x="92" y="354" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">3</text>
<text x="136" y="354" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">定档</text>
<text x="250" y="354" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">质量档 + 执行模式，你说了算</text>

<circle cx="76" cy="400" r="4.5" fill="#378ADD"/>
<text x="92" y="404" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">4</text>
<text x="136" y="404" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">环境权限</text>
<text x="250" y="404" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">探测环境、判截图能力、冒烟测试</text>

<circle cx="76" cy="450" r="4.5" fill="#378ADD"/>
<text x="92" y="454" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">5</text>
<text x="136" y="454" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">水印信息</text>
<text x="250" y="454" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">只有高质量档才问你学号姓名</text>

<circle cx="76" cy="500" r="5.5" fill="#1D9E75"/>
<text x="92" y="504" font-size="12" font-weight="500" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">6</text>
<text x="136" y="504" font-size="13" font-weight="500" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">执行</text>
<text x="250" y="504" font-size="12" fill="#4A8E74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">跑一步截一张，全程记账</text>

<circle cx="76" cy="550" r="4.5" fill="#378ADD"/>
<text x="92" y="554" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">7</text>
<text x="136" y="554" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">交付</text>
<text x="250" y="554" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">填模板、回读校验、打包</text>

<circle cx="76" cy="600" r="4.5" fill="#378ADD"/>
<text x="92" y="604" font-size="12" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">8</text>
<text x="136" y="604" font-size="13" font-weight="500" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">复盘</text>
<text x="250" y="604" font-size="12" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">只说不动，给你一份时间账本</text>
</svg>
