<svg viewBox="0 0 1200 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>labrunner 封面</title>
<desc>labrunner 项目封面，副标题 Don't fake it. Run it.，右侧的跑道意象表示流水线跑通了大半，停在自动沉淀那一程。</desc>
<rect x="0" y="0" width="1200" height="420" rx="14" fill="#F8F7F4"/>
<text x="72" y="170" font-size="76" font-weight="500" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">labrunner</text>
<text x="72" y="218" font-size="24" fill="#5F6B7A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">Don't fake it. Run it.</text>
<line x1="72" y1="252" x2="470" y2="252" stroke="#DCD8CF" stroke-width="1"/>
<text x="72" y="292" font-size="19" fill="#6B7683" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">实验不只写在纸上，要真的跑起来。</text>
<rect x="72" y="320" width="204" height="34" rx="17" fill="#FFFFFF" stroke="#DCD8CF" stroke-width="1"/>
<text x="174" y="342" font-size="13" fill="#8A8578" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">设计手账 · 2026 归档</text>

<text x="680" y="110" font-size="13" fill="#8A8578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">流水线 · 十一个阶段</text>
<line x1="680" y1="160" x2="1094" y2="160" stroke="#C9DCF2" stroke-width="7" stroke-linecap="round"/>
<circle cx="1100" cy="160" r="7" fill="#378ADD"/>
<line x1="680" y1="210" x2="1094" y2="210" stroke="#C9DCF2" stroke-width="7" stroke-linecap="round"/>
<circle cx="1100" cy="210" r="7" fill="#378ADD"/>
<line x1="680" y1="260" x2="1094" y2="260" stroke="#C9DCF2" stroke-width="7" stroke-linecap="round"/>
<circle cx="1100" cy="260" r="7" fill="#378ADD"/>
<line x1="680" y1="310" x2="1094" y2="310" stroke="#C9DCF2" stroke-width="7" stroke-linecap="round"/>
<circle cx="1100" cy="310" r="7" fill="#378ADD"/>
<line x1="680" y1="360" x2="894" y2="360" stroke="#C9DCF2" stroke-width="7" stroke-linecap="round"/>
<line x1="900" y1="360" x2="1094" y2="360" stroke="#C9C4B8" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 8"/>
<circle cx="1100" cy="360" r="7" fill="#F8F7F4" stroke="#B9B4A7" stroke-width="1.5"/>
<text x="680" y="400" font-size="13" fill="#8A8578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">跑通了大半，停在自动沉淀那一程</text>
</svg>
